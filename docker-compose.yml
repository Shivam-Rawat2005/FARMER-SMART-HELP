version: '3.8'

services:
  backend:
    build:
      context: ./farmer-backend
      dockerfile: Dockerfile
    container_name: farmer-backend
    restart: always
    ports:
      - "5001:5001"
    env_file:
      - ./farmer-backend/.env
    environment:
      - PORT=5001
      - NODE_ENV=production
    networks:
      - farmer-network

  frontend:
    build:
      context: ./farmer-frontend
      dockerfile: Dockerfile
    container_name: farmer-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - farmer-network

networks:
  farmer-network:
    driver: bridge
